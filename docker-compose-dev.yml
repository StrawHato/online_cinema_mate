services:

  backend:
    build: .
    container_name: online_cinema_backend
    env_file:
      - .env
    command: sh scripts/run_web_server_dev.sh
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      mailhog:
        condition: service_started

  alembic:
    build: .
    container_name: online_cinema_alembic
    env_file:
      - .env
    command: >
      sh -c "
      python scripts/wait_for_db.py &&
      alembic upgrade head &&
      python -m src.database.seed
      "
    depends_on:
      postgres:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: online_cinema_celery
    env_file:
      - .env
    command: celery -A src.celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: online_cinema_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: online_cinema_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: online_cinema_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: online_cinema_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio_init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: online_cinema_minio_init
    env_file:
      - .env
    volumes:
      - ./scripts:/scripts
    entrypoint: sh /scripts/setup_minio.sh
    depends_on:
      - minio

volumes:
  postgres_data:
  minio_data:
